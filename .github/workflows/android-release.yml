name: Android release

# Builds the Android APK. Push a tag like v1.0.1 to publish a GitHub Release with the APK attached,
# or run it by hand from the Actions tab to get the APK as a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web app and sync into Android
        run: npm run sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          OUT="NimbusBook-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          body: |
            ## Install on Android
            1. On your phone, open this page and tap **${{ steps.apk.outputs.file }}** under *Assets* to download it.
            2. Open the downloaded file. If Android asks, allow your browser or Files app to **install unknown apps**.
            3. Tap **Install**, then open **Nimbus Book**.

            Nimbus Book works fully offline, and all data stays on your phone. Use **Reports → Back up all books** to keep a copy.

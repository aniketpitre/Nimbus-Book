name: Android release

# Builds the Android APK and publishes a GitHub Release with it attached.
# Start it from the Actions tab ("Run workflow", enter a version like 1.0.1), or push a tag like v1.0.1.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1 (leave empty to only build the APK)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web app and sync into Android
        run: npm run sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then VERSION="${INPUT_VERSION#v}"
          else VERSION="dev-${GITHUB_SHA::7}"; fi
          OUT="NimbusBook-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nimbus Book ${{ steps.apk.outputs.version }}
          make_latest: true
          files: ${{ steps.apk.outputs.file }}
          body: |
            ## Install on Android
            1. On your phone, open this page and tap **${{ steps.apk.outputs.file }}** under *Assets* to download it.
            2. Open the downloaded file. If Android asks, allow your browser or Files app to **install unknown apps**.
            3. Tap **Install**, then open **Nimbus Book**.

            Nimbus Book works fully offline, and all data stays on your phone. Use **Settings (gear icon) → Back up all books** to keep a copy.

name: Tests

# Runs on every push, and before every release (the release workflow calls it).
# 1. web:     deep browser tests, including the app running on Capacitor's real Android bridge
# 2. android: installs the APK on an Android emulator and tests the real app (back key, files, share menu)
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser and bridge tests
        run: node e2e/web.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-screenshots
          path: e2e-artifacts/

  android:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            node e2e/android.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-screenshots
          path: e2e-artifacts/
